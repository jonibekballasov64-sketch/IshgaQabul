<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ariza tafsilotlari — Nargiza Olimovna akademiyasi</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body { padding: 20px 16px 40px; }
  a.back {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--brand); text-decoration: none; font-size: 13.5px; font-weight: 700; margin-bottom: 14px;
  }
  h1 { font-size: 19px; margin-bottom: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 6px 18px;
  }
  .row { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .k { width: 190px; flex-shrink: 0; color: var(--muted); font-weight: 600; font-size: 13px; }
  .row .v { flex: 1; white-space: pre-wrap; color: var(--ink); }
  img.ss { max-width: 260px; border-radius: var(--radius-sm); margin-top: 6px; display: block; border: 1px solid var(--border); }
  a.file-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--brand); text-decoration: none; font-weight: 700; font-size: 13.5px;
    background: var(--brand-tint); padding: 8px 12px; border-radius: var(--radius-sm);
  }
</style>
</head>
<body>
  <a class="back" href="javascript:history.back()">← Ro'yxatga qaytish</a>
  <h1 id="title">Yuklanmoqda...</h1>
  <div class="card" id="content"></div>
  <div class="brand-footer">Nargiza Olimovna akademiyasi</div>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const key = params.get('key') || '';

    function row(label, value) {
      return `<div class="row"><div class="k">${label}</div><div class="v">${value || '—'}</div></div>`;
    }

    async function load() {
      const res = await fetch(`/api/applications/${id}`, { headers: { 'X-Admin-Key': key } });
      if (!res.ok) { document.getElementById('content').innerHTML = '<div class="row"><div class="v">Topilmadi yoki kirish rad etildi.</div></div>'; return; }
      const a = await res.json();
      document.getElementById('title').textContent = `#${a.id} — ${a.ism_sharif || 'nomsiz'}`;
      let html = '';
      html += row('Lavozim', a.lavozim);
      html += row("F.I.Sh.", a.ism_sharif);
      html += row("Tug'ilgan yili", a.tugilgan_yili);
      html += row('Telefon', a.telefon);
      html += row('Viloyat', a.viloyat);
      html += row('Tuman/manzil', a.yashash_joyi);
      html += row("Ta'lim", a.talim);
      html += row('ATT ball / toifa', `${a.att_ball || ''} / ${a.att_daraja || ''}`);
      html += row('Milliy Sertifikat', a.milliy_sertifikat_daraja);
      html += row('Ish tajribasi', `${a.ish_tajribasi_yil || ''} yil — ${a.tajriba || ''}`);
      html += row('Pedagogik standart', a.pedagogik_standart);
      html += row('Zoom/Meet/YouTube orqali dars o\'ta oladi?', { ha: 'Ha', yoq: "Yo'q", qisman: 'Qisman' }[a.onlayn_dars_otkazish] || a.onlayn_dars_otkazish);
      html += row('Zoom/Meet tajribasi', a.zoom_meet_tajriba);
      html += row('Telegram tajribasi', a.telegram_tajriba);
      html += row('YouTube tajribasi', a.youtube_tajriba);
      html += row('Haftalik kun', a.haftalik_kun);
      html += row('Namunaviy video', a.namunaviy_video_link || (a.namunaviy_video_file_id ? 'Video fayl (botda yuborilgan)' : null));
      html += row('Namunaviy test', a.namunaviy_test);
      html += row('Shartga rozilik', a.shartga_rozi === true ? 'Roziman' : a.shartga_rozi === false ? 'Rozi emas' : '—');
      html += row('Holat', a.holat);
      html += row('Sana', new Date(a.created_at).toLocaleString('uz-UZ'));

      function fileLink(fileId) {
        return `<a class="file-link" href="/api/photo/${fileId}?key=${encodeURIComponent(key)}" target="_blank" rel="noopener">📎 Faylni ko'rish</a>`;
      }

      if (a.att_screenshot_file_id) {
        html += row('ATT skrinshot', fileLink(a.att_screenshot_file_id));
      }
      if (a.milliy_sertifikat_screenshot_file_id) {
        html += row('Milliy Sertifikat skrinshot', fileLink(a.milliy_sertifikat_screenshot_file_id));
      }
      if (a.diploma_file_id) {
        html += row('Diplom', fileLink(a.diploma_file_id));
      }

      document.getElementById('content').innerHTML = html;
    }
    load();
  </script>
</body>
</html>
