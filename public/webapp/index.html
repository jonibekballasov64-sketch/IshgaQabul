<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ishga qabul — Nargiza Olimovna akademiyasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/shared.css" />
<style>
  body { padding: 18px 16px 150px; }

  .masthead { margin-bottom: 18px; }
  .masthead .eyebrow {
    font-size: 12px; color: var(--muted); font-weight: 700;
    letter-spacing: 0.02em; margin-bottom: 4px;
  }
  .masthead h1 { font-size: 21px; line-height: 1.3; }

  .step-indicator {
    display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
  }
  .step-indicator .count {
    font-family: 'Lora', serif; font-size: 13px; color: var(--brand); font-weight: 600;
    white-space: nowrap;
  }
  .step-indicator .track {
    flex: 1; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .step-indicator .fill {
    height: 100%; background: var(--gold); border-radius: 4px; transition: width .25s ease;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 18px;
  }

  .step { display: none; }
  .step.active { display: block; animation: rise .18s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .step-title { font-size: 17px; margin-bottom: 16px; }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft);
    margin-bottom: 7px;
  }
  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15.5px;
    font-family: inherit;
    background: #fdfcfa;
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--brand);
  }
  textarea { min-height: 72px; resize: vertical; line-height: 1.5; }

  .radio-group, .toggle-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .radio-btn, .toggle-btn {
    flex: 1; min-width: 130px;
    text-align: center;
    padding: 15px 10px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
    background: #fdfcfa;
    user-select: none;
    transition: border-color .12s, background .12s, color .12s;
  }
  .radio-btn.active, .toggle-btn.active {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  .hidden { display: none !important; }
  .error {
    color: var(--danger); font-size: 13px; margin-top: 12px; display: none;
    background: #fbeae6; padding: 10px 12px; border-radius: var(--radius-sm);
  }

  .nav-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    padding: 18px 16px 14px;
  }
  .nav-btns { display: flex; gap: 10px; max-width: 520px; margin: 0 auto; }
  .nav-btns .btn { flex: 1; }
  #backBtn { flex: 0 0 auto; padding-left: 16px; padding-right: 16px; }

  .summary-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .k { color: var(--muted); white-space: nowrap; }
  .summary-row .v { text-align: right; font-weight: 600; color: var(--ink); }

  .hint-box {
    margin-top: 16px; padding: 12px 14px; background: var(--gold-soft);
    border-radius: var(--radius-sm); font-size: 13px; color: #5a4418; line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="masthead">
    <div class="eyebrow">Ishga qabul</div>
    <h1 id="pageTitle">Qaysi lavozimga ariza topshirmoqchisiz?</h1>
  </div>

  <div class="step-indicator">
    <div class="track"><div class="fill" id="progressFill"></div></div>
    <div class="count" id="stepCount">1 / 6</div>
  </div>

  <div class="card">
    <form id="arizaForm">

      <!-- Step 0: Lavozim -->
      <div class="step active" data-step="0">
        <div class="radio-group" id="lavozimGroup">
          <div class="radio-btn" data-value="Grammatika ustoz">📘 Grammatika ustoz</div>
          <div class="radio-btn" data-value="Pedmahorat ustoz">🎓 Pedmahorat ustoz</div>
        </div>
      </div>

      <!-- Step 1: Umumiy ma'lumot -->
      <div class="step" data-step="1">
        <div class="field">
          <label>F.I.Sh.</label>
          <input type="text" id="ism_sharif" required />
        </div>
        <div class="field">
          <label>Tug'ilgan yili</label>
          <input type="number" id="tugilgan_yili" min="1950" max="2010" placeholder="masalan: 1995" required />
        </div>
        <div class="field">
          <label>Telefon raqami</label>
          <input type="tel" id="telefon" placeholder="+998901234567" required />
        </div>
        <div class="field">
          <label>Viloyat</label>
          <select id="viloyat" required>
            <option value="">Tanlang...</option>
            <option>Toshkent shahri</option>
            <option>Toshkent viloyati</option>
            <option>Andijon</option>
            <option>Farg'ona</option>
            <option>Namangan</option>
            <option>Sirdaryo</option>
            <option>Jizzax</option>
            <option>Samarqand</option>
            <option>Buxoro</option>
            <option>Navoiy</option>
            <option>Qashqadaryo</option>
            <option>Surxondaryo</option>
            <option>Xorazm</option>
            <option>Qoraqalpog'iston</option>
          </select>
        </div>
        <div class="field">
          <label>Tuman / mahalla (ixtiyoriy)</label>
          <input type="text" id="yashash_joyi" />
        </div>
        <div class="field">
          <label>Ta'lim (OTM, yo'nalish, bitirgan yili)</label>
          <textarea id="talim" required></textarea>
        </div>
      </div>

      <!-- Step 2: Malaka ko'rsatkichlari -->
      <div class="step" data-step="2">
        <div class="field">
          <label>ATT (attestatsiya) balli</label>
          <input type="number" id="att_ball" min="0" max="100" required />
        </div>
        <div class="field">
          <label>ATT toifasi</label>
          <select id="att_daraja" required>
            <option value="">Tanlang...</option>
            <option>Oliy toifa</option>
            <option>1-toifa</option>
            <option>2-toifa</option>
          </select>
        </div>
        <div class="field">
          <label>Milliy Sertifikat darajasi</label>
          <select id="milliy_sertifikat_daraja" required>
            <option value="">Tanlang...</option>
            <option>A+</option>
            <option>A</option>
            <option>B+</option>
            <option>B</option>
            <option>C+</option>
            <option>C</option>
          </select>
        </div>
      </div>

      <!-- Step 3: Ish tajribasi -->
      <div class="step" data-step="3">
        <div class="field">
          <label>Ish tajribasi (yil)</label>
          <input type="number" id="ish_tajribasi_yil" min="0" max="50" required />
        </div>
        <div class="field">
          <label>Qayerda, qaysi yo'nalishda ishlagansiz</label>
          <textarea id="tajriba" required></textarea>
        </div>
        <div id="pedagogikField" class="field hidden">
          <label>Pedagogik kasb standarti bo'yicha 15 banddan nechtasi bo'yicha ishlagansiz?</label>
          <input type="number" id="pedagogik_standart" min="0" max="15" placeholder="masalan: 14" />
        </div>
      </div>

      <!-- Step 4: Texnik ko'nikmalar -->
      <div class="step" data-step="4">
        <div class="field">
          <label>Google Meet/Zoom orqali dars o'tgan tajribangiz</label>
          <textarea id="zoom_meet_tajriba" required></textarea>
        </div>
        <div class="field">
          <label>Telegram guruh/kanal orqali ishlagan tajribangiz</label>
          <textarea id="telegram_tajriba" required></textarea>
        </div>
        <div class="field">
          <label>YouTube orqali videodars joylagan tajribangiz</label>
          <textarea id="youtube_tajriba" required></textarea>
        </div>
        <div class="field">
          <label>Haftada nechta kun ishlashga tayyorsiz</label>
          <div class="toggle-group" id="kunGroup">
            <div class="toggle-btn" data-value="2 kun">2 kun</div>
            <div class="toggle-btn" data-value="3 kun">3 kun</div>
          </div>
        </div>
      </div>

      <!-- Step 5: Tasdiqlash -->
      <div class="step" data-step="5">
        <div id="summaryBox"></div>
        <div class="hint-box">
          "Yuborish" tugmasini bossangiz, suhbat davom etadi — u yerda ATT va Milliy Sertifikat
          skrinshotlarini, namunaviy videodars va testni yuborasiz.
        </div>
      </div>

      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <div class="brand-footer">Nargiza Olimovna akademiyasi</div>

  <div class="nav-bar">
    <div class="nav-btns">
      <button type="button" class="btn btn-ghost" id="backBtn">Orqaga</button>
      <button type="button" class="btn btn-primary" id="nextBtn">Davom etish</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); tg.ready(); }

    const TOTAL_STEPS = 6;
    const STEP_TITLES = [
      "Qaysi lavozimga ariza topshirmoqchisiz?",
      "Umumiy ma'lumot",
      "Malaka ko'rsatkichlari",
      "Ish tajribasi",
      "Texnik ko'nikmalar",
      "Tekshirib chiqing",
    ];
    let current = 0;

    const steps = Array.from(document.querySelectorAll('.step'));

    function setupGroup(groupId) {
      const group = document.getElementById(groupId);
      group.querySelectorAll('[data-value]').forEach((btn) => {
        btn.addEventListener('click', () => {
          group.querySelectorAll('[data-value]').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          if (groupId === 'lavozimGroup') {
            const pedField = document.getElementById('pedagogikField');
            if (btn.dataset.value === 'Pedmahorat ustoz') {
              pedField.classList.remove('hidden');
              document.getElementById('pedagogik_standart').required = true;
            } else {
              pedField.classList.add('hidden');
              document.getElementById('pedagogik_standart').required = false;
            }
          }
        });
      });
    }
    setupGroup('lavozimGroup');
    setupGroup('kunGroup');

    function getActive(groupId) {
      const el = document.querySelector(`#${groupId} .active`);
      return el ? el.dataset.value : null;
    }

    function showError(msg) {
      const e = document.getElementById('errorMsg');
      e.textContent = msg;
      e.style.display = 'block';
    }
    function clearError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    function validateStep(stepIndex) {
      if (stepIndex === 0) {
        if (!getActive('lavozimGroup')) { showError('Iltimos, lavozimni tanlang.'); return false; }
      } else if (stepIndex === 4) {
        if (!getActive('kunGroup')) { showError('Iltimos, haftalik kunni tanlang.'); return false; }
        const stepEl = steps.find((s) => s.dataset.step == stepIndex);
        const inputs = stepEl.querySelectorAll('textarea[required], input[required], select[required]');
        for (const el of inputs) { if (!el.checkValidity()) { el.reportValidity(); return false; } }
      } else {
        const stepEl = steps.find((s) => s.dataset.step == stepIndex);
        const inputs = stepEl.querySelectorAll('textarea[required], input[required], select[required]');
        for (const el of inputs) {
          if (el.offsetParent === null) continue;
          if (!el.checkValidity()) { el.reportValidity(); return false; }
        }
      }
      clearError();
      return true;
    }

    function collectData() {
      return {
        lavozim: getActive('lavozimGroup'),
        ism_sharif: document.getElementById('ism_sharif').value.trim(),
        tugilgan_yili: document.getElementById('tugilgan_yili').value.trim(),
        telefon: document.getElementById('telefon').value.trim(),
        viloyat: document.getElementById('viloyat').value,
        yashash_joyi: document.getElementById('yashash_joyi').value.trim(),
        talim: document.getElementById('talim').value.trim(),
        att_ball: document.getElementById('att_ball').value.trim(),
        att_daraja: document.getElementById('att_daraja').value,
        milliy_sertifikat_daraja: document.getElementById('milliy_sertifikat_daraja').value,
        ish_tajribasi_yil: document.getElementById('ish_tajribasi_yil').value.trim(),
        tajriba: document.getElementById('tajriba').value.trim(),
        pedagogik_standart: document.getElementById('pedagogik_standart').value.trim(),
        zoom_meet_tajriba: document.getElementById('zoom_meet_tajriba').value.trim(),
        telegram_tajriba: document.getElementById('telegram_tajriba').value.trim(),
        youtube_tajriba: document.getElementById('youtube_tajriba').value.trim(),
        haftalik_kun: getActive('kunGroup'),
      };
    }

    function renderSummary() {
      const d = collectData();
      const rows = [
        ['Lavozim', d.lavozim], ["F.I.Sh.", d.ism_sharif], ["Tug'ilgan yili", d.tugilgan_yili],
        ['Telefon', d.telefon], ['Viloyat', d.viloyat], ["Ta'lim", d.talim],
        ['ATT', `${d.att_ball} ball, ${d.att_daraja}`], ['Milliy Sertifikat', d.milliy_sertifikat_daraja],
        ['Ish tajribasi', `${d.ish_tajribasi_yil} yil`], ['Haftalik kun', d.haftalik_kun],
      ];
      document.getElementById('summaryBox').innerHTML = rows
        .map(([k, v]) => `<div class="summary-row"><div class="k">${k}</div><div class="v">${v || '—'}</div></div>`)
        .join('');
    }

    function updateUI() {
      steps.forEach((s) => s.classList.toggle('active', s.dataset.step == current));
      document.getElementById('progressFill').style.width = `${((current + 1) / TOTAL_STEPS) * 100}%`;
      document.getElementById('stepCount').textContent = `${current + 1} / ${TOTAL_STEPS}`;
      document.getElementById('pageTitle').textContent = STEP_TITLES[current];
      document.getElementById('backBtn').style.visibility = current === 0 ? 'hidden' : 'visible';
      document.getElementById('nextBtn').textContent = current === TOTAL_STEPS - 1 ? 'Yuborish' : 'Davom etish';
      if (current === TOTAL_STEPS - 1) renderSummary();
      window.scrollTo(0, 0);
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      clearError();
      if (current > 0) { current -= 1; updateUI(); }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (!validateStep(current)) return;
      if (current < TOTAL_STEPS - 1) {
        current += 1;
        updateUI();
        return;
      }
      const data = collectData();
      if (tg) {
        tg.sendData(JSON.stringify(data));
        tg.close();
      } else {
        alert('Bu sahifa faqat Telegram ichida ishlaydi.');
      }
    });

    updateUI();
  </script>
</body>
</html>
